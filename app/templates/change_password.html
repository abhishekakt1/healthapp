<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-lg p-10 w-full max-w-md border border-gray-100">
        <div class="text-center mb-8">
            <div class="text-4xl mb-3">🔐</div>
            <h1 class="text-2xl font-bold text-gray-800">Set Your Password</h1>
            <p class="text-gray-500 mt-2 text-sm">You're using the default password. Please set a new one to continue.</p>
        </div>
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">New Password</label>
                <input id="newPw" type="password" placeholder="Enter new password"
                    class="w-full border-2 border-gray-200 focus:border-blue-400 rounded-lg px-4 py-3 outline-none text-gray-800">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">Confirm Password</label>
                <input id="confirmPw" type="password" placeholder="Confirm new password"
                    class="w-full border-2 border-gray-200 focus:border-blue-400 rounded-lg px-4 py-3 outline-none text-gray-800">
            </div>
            <p id="errMsg" class="text-red-500 text-sm hidden"></p>
            <button onclick="submitChange()"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow transition-colors mt-2">
                Set Password & Continue
            </button>
        </div>
    </div>
    <script>
        async function submitChange() {
            const pw = document.getElementById('newPw').value;
            const confirm = document.getElementById('confirmPw').value;
            const err = document.getElementById('errMsg');
            if (pw.length < 4) { err.textContent = 'Password must be at least 4 characters'; err.classList.remove('hidden'); return; }
            if (pw !== confirm) { err.textContent = 'Passwords do not match'; err.classList.remove('hidden'); return; }
            err.classList.add('hidden');
            const fd = new FormData();
            fd.append('new_password', pw);
            const res = await fetch('/api/change-password', { method: 'POST', body: fd });
            if (res.ok) {
                window.location.href = '/dashboard';
            } else {
                const data = await res.json();
                err.textContent = data.detail || 'Error'; err.classList.remove('hidden');
            }
        }
        document.addEventListener('keydown', e => { if (e.key === 'Enter') submitChange(); });
    </script>
</body>
</html>
